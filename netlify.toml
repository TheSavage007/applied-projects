# Netlify deployment configuration for static, framework free sites.
# The modules in this repository need no build step, so the site publishes as is.

[build]
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Single page app fallback so deep links resolve instead of returning 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers applied to every response
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"

# Long lived caching for fingerprinted static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML always revalidates so visitors get the latest release
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[context.production.environment]
  NODE_ENV = "production"
